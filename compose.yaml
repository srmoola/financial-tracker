# Local development environment. Start with: docker compose up
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/rails
  environment:
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 30

  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]

  jobs:
    <<: *app
    command: bin/jobs
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
